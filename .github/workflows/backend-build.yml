name: Backend Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: master_learning
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d master_learning"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/master_learning
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: MasterLearningPlatformCIJwtSecretKey2026!DoNotUseInProduction
      RUN_SUPER_ADMIN_CONCURRENCY_TEST: "true"
      SUPER_ADMIN_CONCURRENCY_TEST_DB_URL: jdbc:postgresql://localhost:5432/master_learning
      SUPER_ADMIN_CONCURRENCY_TEST_DB_USERNAME: postgres
      SUPER_ADMIN_CONCURRENCY_TEST_DB_PASSWORD: postgres
      MAIL_HOST: localhost
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      APP_FRONTEND_URL: http://localhost:4200
      MAIL_FROM: no-reply@masterlearning.local
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4200

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend
        run: mvn -B -ntp verify
