spring:
  main:
    banner-mode: console

  flyway:
    locations: classpath:db/migration,classpath:db/local-migration

  datasource:
    # Use IPv4 explicitly on Windows/Docker Desktop to avoid localhost IPv6/WSL relay routing.
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/master_learning}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

app:
  security:
    jwt:
      secret: ${JWT_SECRET:MySuperSecureJWTSecretKeyForMasterLearningPlatform2026!ChangeMe}
