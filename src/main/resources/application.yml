spring:
  application:
    name: universal-master-learning-platform-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validateOnMigrate: false
    repairOnMigrate: true

server:
  port: 8080

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@masterlearning.local}
  security:
    bcrypt-strength: 12
    refresh-token-days: 30
    jwt:
      secret: ${JWT_SECRET}
      access-token-minutes: 15
      issuer: universal-master-learning-platform
    cors:
      allowed-origins:
        - http://localhost:4200
  payment:
    razorpay:
      base-url: https://api.razorpay.com/v1
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  ai:
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_AI_TEACHER_MODEL:gpt-5.6-luna}
    teacher:
      quota:
        free-monthly-turns: ${AI_TEACHER_FREE_MONTHLY_TURNS:25}
        premium-monthly-turns: ${AI_TEACHER_PREMIUM_MONTHLY_TURNS:500}
        pro-monthly-turns: ${AI_TEACHER_PRO_MONTHLY_TURNS:2000}
        enterprise-monthly-turns: ${AI_TEACHER_ENTERPRISE_MONTHLY_TURNS:10000}

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
