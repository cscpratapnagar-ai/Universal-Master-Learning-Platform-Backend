spring:
  application:
    name: universal-master-learning-platform-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validateOnMigrate: false
    repairOnMigrate: true
server:
  port: 8080
app:
  security:
    bcrypt-strength: 12
    refresh-token-days: 30
    jwt:
      secret: ${JWT_SECRET}
      access-token-minutes: 15
      issuer: universal-master-learning-platform
    cors:
      allowed-origins:
        - http://localhost:4200
management:
  endpoints:
    web:
      exposure:
        include: health,info