spring:
  application:
    name: universal-master-learning-platform
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  api:
    version: v1
  security:
    bcrypt-strength: 12
    cors:
      allowed-origins:
        - http://localhost:4200